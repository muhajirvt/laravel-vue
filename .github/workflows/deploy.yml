
name: Deploy to EC2

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  APP_PATH: /var/www/html/laravel-vue
  PHP_VERSION: "8.5"
  NODE_VERSION: "22"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: root
      DB_PASSWORD: secret

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, xml, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed database
        run: php artisan db:seed --force

      - name: Run Laravel tests
        run: php artisan test


  # ==========================================
  # JOB 2: DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: test

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" 'bash -s' << 'EOF'

            set -e

            cd /var/www/html/laravel-vue

            # Ensure maintenance mode is disabled on exit
            trap 'php artisan up || true' EXIT

            # Enable maintenance mode
            php artisan down || true

            # Pull latest code
            git fetch origin master
            git reset --hard origin/master

            # Install PHP dependencies
            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --no-progress

            # Install and build Vue frontend
            npm ci
            npm run build

            # Run database migrations
            php artisan migrate --force

            # Run Super Admin seeder
            php artisan db:seed --class=SuperAdminSeeder --force

            # Create storage symlink
            php artisan storage:link || true

            # Clear old caches
            php artisan optimize:clear

            # Rebuild Laravel caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Restart background workers
            php artisan queue:restart || true
            php artisan reverb:restart || true

            # Reload PHP-FPM
            sudo systemctl reload php8.5-fpm || true

            # Disable maintenance mode
            php artisan up

            EOF
