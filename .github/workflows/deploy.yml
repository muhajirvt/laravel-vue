
name: Deploy to EC2

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  APP_PATH: /var/www/html/laravel-vue
  PHP_VERSION: "8.5"
  NODE_VERSION: "22"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ==========================================
  # JOB 1: TEST
  # ==========================================
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, bcmath, xml, curl
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Seed
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan db:seed --force

      - name: Run Laravel tests
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_test
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test


  # ==========================================
  # JOB 2: DEPLOY TO EC2
  # ==========================================
  deploy:
    name: Deploy to EC2
    needs: test

    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      - name: Setup SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" 'bash -se' <<'EOF'
          set -e

          cd /var/www/html/laravel-vue

          # Enable maintenance mode
          php artisan down || true

          # Always bring application live after deployment
          trap 'php artisan up || true' EXIT

          # Fetch latest code
          git fetch origin master
          git reset --hard origin/master

          # Install PHP dependencies
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

          # Install and build Vue frontend
          npm ci
          npm run build

          # Run database migrations
          php artisan migrate --force

          # Run seeder
          php artisan db:seed --force

          # Create storage link if missing
          if [ ! -L public/storage ]; then
              php artisan storage:link
          fi

          # Clear existing Laravel caches
          php artisan optimize:clear

          # Rebuild production caches
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          # Restart queue workers
          php artisan queue:restart || true

          # Restart Reverb
          php artisan reverb:restart || true

          # Reload Apache (PHP 8.5 mod_php)
          sudo systemctl reload apache2

          # Application will be brought live by EXIT trap

          EOF


